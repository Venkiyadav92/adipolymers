<section class="cta-section" aria-labelledby="cta-heading">
  <div class="cta-section__bg" aria-hidden="true">
    <div class="cta-orb cta-orb--1"></div>
    <div class="cta-orb cta-orb--2"></div>
    <div class="cta-section__grid"></div>
  </div>

  <div class="container">
    <div class="cta-section__inner" [apScrollAnimate]="'scale'">

      <div class="cta-section__badges" [apScrollAnimate]="'fade-up'" [scrollDelay]="50">
        <span class="cta-badge cta-badge--green">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2-8 4-4 8-4 8s-4-6 3-8"/></svg>
          Eco-Certified
        </span>
        <span class="cta-badge cta-badge--purple">ISO 14001</span>
        <span class="cta-badge cta-badge--orange">EN 13432</span>
      </div>

      <h2 class="cta-section__title" id="cta-heading" [apScrollAnimate]="'fade-up'" [scrollDelay]="100">
        Ready to Build a
        <span class="cta-section__highlight">Sustainable Future</span>
        Together?
      </h2>

   

      <div class="cta-section__actions" [apScrollAnimate]="'fade-up'" [scrollDelay]="200">
        <a routerLink="/contact" class="cta-btn-primary">
          Get a Free Consultation
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a routerLink="/products" class="cta-btn-ghost">
          Browse Products
        </a>
      </div>

      <!-- Contact Quick Info -->
      <div class="cta-section__contacts" [apScrollAnimate]="'fade-up'" [scrollDelay]="250">
        <a href="tel:+919876543210" class="cta-contact-item">
          <div class="cta-contact-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </div>
          <div>
            <p class="cta-contact-label">Call Us</p>
            <p class="cta-contact-value">+91 7305993999</p>
          </div>
        </a>
        <div class="cta-contact-divider" aria-hidden="true"></div>
        <a href="mailto:info@adityapolymers.co.in" class="cta-contact-item">
          <div class="cta-contact-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div>
            <p class="cta-contact-label">Email Us</p>
            <p class="cta-contact-value">info&#64;adityapolymers.co.in</p>
          </div>
        </a>
        <div class="cta-contact-divider" aria-hidden="true"></div>
        <div class="cta-contact-item">
          <div class="cta-contact-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <p class="cta-contact-label">Business Hours</p>
            <p class="cta-contact-value">Mon–Sat, 9 AM – 6 PM IST</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
