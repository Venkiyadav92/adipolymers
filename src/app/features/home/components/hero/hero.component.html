<section class="hero" aria-label="Hero section">

  <video
  #heroVideo
  class="hero__video"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
>
  <source src="/assets/videos/hero.mp4" type="video/mp4">
</video>

  <div class="hero__overlay" aria-hidden="true"></div>

  <div class="hero__container container">

    <div class="hero__content" [class.animating]="isAnimating()">

      <div class="hero__badge">
        <span class="badge-dot"></span>
        {{ slides[currentSlide()].badge }}
      </div>

      <p class="hero__tagline">{{ slides[currentSlide()].tagline }}</p>

      <h1 class="hero__title">
        {{ slides[currentSlide()].title }}
        @if (slides[currentSlide()].highlight) {
          <span class="hero__highlight">{{ slides[currentSlide()].highlight }}</span>
        }
      </h1>

      <p class="hero__subtitle">
        {{ slides[currentSlide()].subtitle }}
      </p>

      <!-- Rest of your existing content -->

    </div>

  </div>

  <div class="hero__indicators">
    ...
  </div>

</section>
