<section class="services-preview section" aria-labelledby="services-heading">
  <div class="container">

    <ap-section-header
      label="What We Do"
      title='Comprehensive <span class="highlight">Sustainable Services</span>'
      subtitle="From custom formulations to global supply — we're your end-to-end partner for sustainable polymer solutions."
      align="center"
    />

    <div class="services-preview__layout">

      <!-- Services Grid -->
      <div class="services-preview__grid">
        @for (service of services; track service.title; let i = $index) {
          <div class="service-card service-card--{{ service.color }}" [apScrollAnimate]="'fade-up'" [scrollDelay]="i * 100">
            <div class="service-card__media" [style.background-image]="'linear-gradient(135deg, rgba(3, 8, 20, 0.82) 0%, rgba(3, 8, 20, 0.45) 100%), url(' + service.image + ')'" aria-hidden="true"></div>
            <div class="service-card__icon" [innerHTML]="service.icon"></div>
            <h3 class="service-card__title">{{ service.title }}</h3>
            <p class="service-card__desc">{{ service.description }}</p>
            <ul class="service-card__features">
              @for (f of service.features; track f) {
                <li>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                  {{ f }}
                </li>
              }
            </ul>
            <a [routerLink]="service.link" class="service-card__link">
              Learn More
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          </div>
        }
      </div>

      <!-- Side CTA Panel -->
     

    </div>
  </div>
</section>
