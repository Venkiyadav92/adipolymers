<header class="navbar" [class.scrolled]="scrollService.isScrolled()" [class.hidden]="scrollService.scrollDirection() === 'down' && scrollService.scrollY() > 300" role="banner">
  <div class="navbar__inner container">

    <!-- ── Left: Adithya Polymers Brand Logo ─────────────────────── -->
    <a class="navbar__brand" routerLink="/" (click)="closeMenu()" aria-label="Aditya Polymers Home">
      <div class="navbar__logo-frame">
        <img
          src="assets/images/adityaPolymersLogo-removebg-preview.png"
          alt="Aditya Polymers – Quality Packaging Solutions"
          class="navbar__logo"
          loading="eager"
          width="56"
          height="56"
        />
      </div>
    </a>

    <!-- ── Center: Desktop Navigation ───────────────────────────── -->
    <nav class="navbar__nav" role="navigation" aria-label="Main navigation">
      <ul class="navbar__links" role="list">
        @for (link of navLinks; track link.path) {
          <li class="navbar__item">
            <a
              class="navbar__link"
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <!-- ── Right: Mangal Logo + Hamburger ────────────────────────── -->
    <div class="navbar__actions">

      <!-- Mangal World Partner Logo -->
      <a
        href="https://mangal.world"
        class="navbar__partner"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Mangal World — our marketing partner"
        title="Mangal World"
      >
        <div class="navbar__partner-frame">
          <img
            src="https://mangal.world/wp-content/uploads/2024/07/mangalworldlogo.png"
            alt="Mangal World"
            class="navbar__partner-img"
            loading="eager"
            width="195"
            height="110"
          />
        </div>
      </a>

      <!-- Hamburger (tablet + mobile) -->
      <button
        class="navbar__hamburger"
        [class.open]="menuOpen()"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- ── Mobile Menu ────────────────────────────────────────────── -->
  <div class="navbar__mobile" [@mobileMenu]="menuOpen() ? 'open' : 'closed'" role="dialog" aria-modal="true" aria-label="Mobile navigation">

    <!-- Partner Banner -->
    <div class="mobile-partner">
      <span class="mobile-partner__label">In Partnership With</span>
      <a href="https://mangal.world" class="mobile-partner__link" target="_blank" rel="noopener noreferrer" aria-label="Mangal World">
        <img
          src="https://mangal.world/wp-content/uploads/2024/07/mangalworldlogo.png"
          alt="Mangal World"
          class="mobile-partner__img"
          loading="lazy"
          width="195"
          height="110"
        />
      </a>
    </div>

    <nav>
      <ul role="list">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              class="mobile-link"
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="mobile-cta">
      <a routerLink="/contact" class="btn-primary" (click)="closeMenu()">Contact Us</a>
      <a href="https://wa.me/917305993999" class="btn-whatsapp" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

    </div>
  </div>

  <!-- Mobile Backdrop -->
  @if (menuOpen()) {
    <div class="navbar__backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }
</header>
